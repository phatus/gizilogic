version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gizilogic-app
    container_name: gizilogic-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - gizilogic-network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: gizilogic-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - gizilogic-network
    depends_on:
      - app

  db:
    image: postgres:15-alpine
    container_name: gizilogic-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gizilogic}
      POSTGRES_USER: ${DB_USERNAME:-gizilogic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - gizilogic-network
    ports:
      - "5433:5432"

networks:
  gizilogic-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
